spring.application.name=enterprise-basics-review
spring.datasource.generate-unique-name=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8
learning.security.student-password=${LEARNING_STUDENT_PASSWORD}
learning.security.admin-password=${LEARNING_ADMIN_PASSWORD}
logging.pattern.level=%5p [requestId=%X{requestId:-none}]
