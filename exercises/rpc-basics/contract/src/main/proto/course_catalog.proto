syntax = "proto3";

package javamastery.course.v1;

option java_package = "io.github.javamastery.exercises.rpc.contract";
option java_multiple_files = true;
option java_outer_classname = "CourseCatalogProtocol";

service CourseCatalog {
  rpc GetCourse (GetCourseRequest) returns (CourseReply);
}

message GetCourseRequest {
  int64 course_id = 1;
}

message CourseReply {
  int64 course_id = 1;
  string title = 2;
}
